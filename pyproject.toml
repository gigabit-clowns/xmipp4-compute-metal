# SPDX-License-Identifier: GPL-3.0-only

[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "xmipp4-compute-metal"
version = "0.1.0"
authors = [
    { name = "Oier Lauzirika Zarrabeitia", email = "oierlauzi@bizkaia.eu" },
    { name = "Martín Salinas Antón", email = "ssalinasmartin@gmail.com" },
    { name = "Mikel Iceta Tena", email = "m.icetatena@gmail.com" },
]
description = "METAL compute backend for xmipp4"
classifiers = [
	"Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: C++"
]

readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}

requires-python = ">=3.7"
dependencies = [ 
    "xmipp4-core==0.1"
]

[project.urls]
Homepage = "https://github.com/gigabit-clowns/xmipp4-compute-metal"

[tool.scikit-build]
experimental=true # For wheel.install-dir
cmake.version = ">=3.16"
cmake.args = []
cmake.define = {}
cmake.verbose = false
cmake.build-type = "Release"

wheel.install-dir="/data"
